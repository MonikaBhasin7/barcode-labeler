name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build windows --release

      - name: Copy the Visual C++ runtime next to the app
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "Visual C++ runtime folder not found under $vs" }
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item (Join-Path $crt.FullName $dll) "build\windows\x64\runner\Release"
          }

      - name: Read the app version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)'
          "app=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.app }}" installer\barcode_labeler.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: BarcodeLabelerSetup-${{ steps.version.outputs.app }}
          path: installer\Output\*.exe
          if-no-files-found: error
